<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платформа тестувань</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Зверни увагу: підключаємо output.css, якого ще немає, ми його згенеруємо -->
    <link rel="stylesheet" href="output.css">
</head>
<body class="min-h-screen py-4 px-2 sm:px-4">
    <div class="max-w-4xl mx-auto space-y-4">
        <header id="main-header" class="text-center mb-6"></header>
        <div id="app-container" class="space-y-4"></div>

        <div id="controls-container" class="flex flex-col sm:flex-row gap-3 justify-center pt-2 pb-6 hidden">
            <button id="submitBtn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-2 rounded text-xs font-bold shadow-[0_0_15px_rgba(0,242,254,0.3)] transition-all active:scale-95 w-full sm:w-auto">
                Завершити та перевірити
            </button>
        </div>

        <div id="result-box" class="hidden glass-panel p-4 text-center border border-cyan-500/30 mb-8">
            <h3 class="text-sm font-bold text-white mb-1">Ваш результат</h3>
            <div class="text-3xl font-extrabold neon-text-cyan mb-1" id="final-score">0 / 100</div>
            <p id="feedback-msg" class="text-xs text-slate-300"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
